<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EcoTex Sorter{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧵</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="nav">
    <a class="brand" href="{{ url_for('home') }}"><span class="logo"></span>EcoTex Sorter</a>
    <nav>
      <a href="{{ url_for('home') }}" class="{{ 'on' if page == 'home' }}">Home</a>
      <a href="{{ url_for('classify') }}" class="{{ 'on' if page == 'classify' }}">Classify</a>
      <a href="{{ url_for('about') }}" class="{{ 'on' if page == 'about' }}">About</a>
      <button id="theme" class="icon" aria-label="Toggle dark mode">🌓</button>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>EcoTex Sorter, Final Year Project, University of Karachi</footer>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
